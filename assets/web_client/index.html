<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LocalPlay</title>
  <link rel="stylesheet" href="/web/style.css">
</head>

<body>
  <header>
    <h1>LocalPlay</h1>
    <div id="connection" role="status">Offline multiplayer</div>
  </header>
  <section id="joinSection">
    <h2>Join the lobby</h2>
    <form id="joinForm"><input id="name" required maxlength="24" placeholder="Your name" autocomplete="nickname"><button
        type="submit">Join</button></form>
  </section>
  <section id="gameSection" hidden>
    <h2 id="title"></h2>
    <p id="status" role="status"></p>
    <p id="info"></p>
    <div id="privateSection" hidden>
      <img id="privateCard" alt="Your private card" hidden>
      <p id="privateText" hidden></p>
    </div>
    <div id="players"></div>
    <section id="cardSection" hidden>
      <h2 id="tableLabel">Table</h2>
      <div id="table" class="cards"></div>
      <h2>Your hand</h2>
      <div id="hand" class="cards"></div>
    </section>
    <div id="actions"></div>
    <footer><button id="leave" hidden>Leave lobby</button></footer>
  </section>
  <p id="error" role="alert"></p>
  <script type="module" src="/web/app.js"></script>
</body>

</html>
